[package]
name = "ymlink-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rust backend and native desktop bridge for YM_Link"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
ymlink-core = { path = "../core" }
tokio = { version = "1.43", features = ["net", "time", "sync", "macros", "rt-multi-thread", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
sha2 = "0.10"
zeroize = "1.8"

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = { version = "11", features = ["macos_14_0"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = ["Foundation", "Graphics_Capture", "Graphics_DirectX_Direct3D11", "Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Media_Audio", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Performance", "Win32_System_WinRT_Direct3D11", "Win32_System_WinRT_Graphics_Capture"] }

[dev-dependencies]
ciborium = "0.2"
