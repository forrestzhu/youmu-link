[package]
name = "ymlink-desktop"
version.workspace = true
edition.workspace = true
description = "Rust backend and native desktop bridge for YM_Link"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
ymlink-core = { path = "../core" }
tokio = { version = "1.43", features = ["net", "time", "sync", "macros", "rt-multi-thread", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
sha2 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = { version = "11", features = ["macos_14_0"] }

[dev-dependencies]
ciborium = "0.2"
