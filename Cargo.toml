[workspace]
resolver = "2"
members = ["core", "desktop"]

[workspace.package]
version = "0.1.0"
edition = "2021"

# rustc's Mach-O debug stripping can misalign host proc-macro dylibs on macOS 27
# (rust-lang/rust#157750). This affects build tools only, not release optimization.
[profile.release.build-override]
strip = false
