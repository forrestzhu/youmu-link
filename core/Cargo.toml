[package]
name = "ymlink-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "YM_Link LAN protocol core: discovery layer (PROTOCOL §2)"

[dependencies]
tokio = { version = "1.43", features = ["net", "time", "sync", "macros", "rt", "io-util"] }
serde = { version = "1", features = ["derive"] }
ciborium = "0.2"
sha2 = "0.10"
if-addrs = "0.13"
rand = "0.8"
snow = "0.9"
spake2 = "0.4"
hmac = "0.12"
serde_json = "1"
zeroize = "1"
x25519-dalek = "2"
cap-std = "3"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl"] }

[dev-dependencies]
tokio = { version = "1.43", features = ["rt-multi-thread"] }
