name: repository-checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Harness regression
        run: python3 scripts/test_harness.py
      - name: Repository baseline
        run: python3 scripts/harness.py check

  rust:
    # macOS 侧由本地 `harness verify` 覆盖（私有仓库 Actions 分钟数按平台加倍计费）。
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Rustfmt
        run: cargo fmt --all --check
      - name: Tests
        run: cargo test --workspace --all-targets
      - uses: actions/setup-dotnet@v4
        if: runner.os == 'Windows'
        with:
          dotnet-version: '8.0.x'
      - name: Windows native models and localization
        if: runner.os == 'Windows'
        run: dotnet run --project windows/Tests/YM_Link.Tests.csproj
      - name: Windows native build
        if: runner.os == 'Windows'
        run: dotnet build windows/YM_Link/YM_Link.csproj --configuration Release
